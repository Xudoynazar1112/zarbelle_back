{% extends "jazzmin/login.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
  html, body, .jazzmin-login-page, body.jazzmin-login-page, .hold-transition.jazzmin-login-page {
    background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.72)), url("{% static 'images/login_bg.png' %}") no-repeat center center fixed !important;
    background-size: cover !important;
    background-position: center center !important;
    min-height: 100vh !important;
  }
  .jazzmin-login-page {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    min-height: 100vh !important;
  }
  .jazzmin-login-page .login-box {
    width: 420px !important;
    max-width: 94% !important;
    margin: 20px auto !important;
  }
  .jazzmin-login-page .card {
    background: rgba(254, 252, 248, 0.96) !important;
    backdrop-filter: blur(25px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(25px) saturate(180%) !important;
    border-radius: 1.6rem !important;
    border: 1px solid rgba(223, 183, 67, 0.45) !important;
    box-shadow: 0 30px 70px -10px rgba(0, 0, 0, 0.75), 0 0 40px rgba(223, 183, 67, 0.3) !important;
    overflow: hidden !important;
  }
  .jazzmin-login-page .btn-primary {
    background: linear-gradient(135deg, #dfb743 0%, #c59b27 50%, #9a7210 100%) !important;
    border: none !important;
    color: #1a140a !important;
    font-weight: 700 !important;
    border-radius: 0.75rem !important;
    box-shadow: 0 4px 15px rgba(197, 155, 39, 0.4) !important;
    transition: all 0.3s ease !important;
  }
  .jazzmin-login-page .btn-primary:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 25px rgba(197, 155, 39, 0.6) !important;
    filter: brightness(1.08) !important;
  }
  .jazzmin-login-page .form-control {
    border-radius: 0.75rem !important;
    border: 1px solid #ded6ca !important;
    padding: 10px 14px !important;
  }
  .jazzmin-login-page .form-control:focus {
    border-color: #c59b27 !important;
    box-shadow: 0 0 0 0.2rem rgba(197, 155, 39, 0.25) !important;
  }
</style>
{% endblock %}
